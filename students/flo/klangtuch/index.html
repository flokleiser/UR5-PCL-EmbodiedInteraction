<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#002A52">
    <title>Blaupause</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Doto:wght@800..900&display=swap">
    <style>
        :root {
            --blue: #002A52;
            --white: #FFFFFF;
            --dot: #002A52;
            --dot-hot: #2F7BD8;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%
        }

        body {
            background: var(--blue);
            color: var(--white);
            font-family: 'Archivo', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100svh
        }

        h1 {
            margin: 0;
            font-family: 'Doto', 'Archivo', system-ui, sans-serif;
            font-size: clamp(40px, 13vw, 72px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: .01em;
            color: var(--white)
        }

        .lede {
            margin: -8px 0 4px;
            font-size: 18px;
            line-height: 1.4;
            color: var(--white)
        }

        .btn {
            appearance: none;
            font: inherit;
            font-weight: 700;
            font-size: 18px;
            color: var(--blue);
            background: var(--white);
            border: 2px solid var(--white);
            border-radius: 16px;
            min-height: 58px;
            padding: 14px 18px;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px
        }

        .btn.ghost {
            background: transparent;
            color: var(--white)
        }

        .btn:disabled {
            opacity: .4;
            cursor: default
        }

        .btn svg {
            width: 22px;
            height: 22px;
            flex: none
        }

        .file {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
            background: var(--white)
        }

        canvas[hidden] {
            display: none
        }

        .play {
            min-height: 68px;
            font-size: 20px
        }
    </style>
</head>

<body>
    <main>
        <h1>Blaupause</h1>
        <p class="lede">Voices were spoken here, and light turned them into blue. Scan the cloth and listen to the physical traces of recorded voices.</p>
        <label class="btn" for="cam" id="camBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
                <circle cx="12" cy="13" r="3.5" />
            </svg>
            Take photo
        </label>
        <input class="file" type="file" id="cam" accept="image/*" capture="environment">
        <canvas id="view" hidden aria-label="Musikwalze"></canvas>
        <button type="button" class="btn ghost play" id="play" disabled>▶ Play</button>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const els = {cam: $('cam'), camBtn: $('camBtn'), view: $('view'), play: $('play')};
        const ROWS = 24, MAXW = 1000, SR = 44100, TAIL = 3, POLY = 6, DUR = 16, SENS = 0.5;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const S = {src: null, pins: [], wav: null, url: null, audio: null, raf: 0, dirty: true, aspect: 2.2, ready: false};
        const PLAY = '\u25B6 Play', STOP = '\u25A0 Stop';

        function rowFreq(row) {
            let f = 80 * Math.pow(2000 / 80, row / (ROWS - 1));
            while (f < 330) f *= 2;
            while (f > 2100) f /= 2;
            return 440 * Math.pow(2, Math.round(12 * Math.log2(f / 440)) / 12);
        }

        function pixels() {
            const im = S.src, rot = 0, iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
            const sw = rot % 2 ? ih : iw, sh = rot % 2 ? iw : ih, k = Math.min(1, MAXW / Math.max(sw, sh));
            const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const g = c.getContext('2d', {willReadFrequently: true});
            g.translate(w / 2, h / 2); g.rotate(rot * Math.PI / 2);
            const dw = rot % 2 ? h : w, dh = rot % 2 ? w : h;
            g.drawImage(im, -dw / 2, -dh / 2, dw, dh);
            const d = g.getImageData(0, 0, w, h).data;
            c.width = c.height = 1;
            return {d, w, h};
        }

        function boxBlur(src, w, h, r) {
            const I = new Float64Array((w + 1) * (h + 1));
            for (let y = 0; y < h; y++) {
                let row = 0;
                for (let x = 0; x < w; x++) {row += src[y * w + x]; I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + row;}
            }
            const out = new Float32Array(w * h);
            for (let y = 0; y < h; y++) {
                const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
                for (let x = 0; x < w; x++) {
                    const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
                    const s = I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0];
                    out[y * w + x] = s / ((x1 - x0) * (y1 - y0));
                }
            }
            return out;
        }

        function detect(d, w, h, sens, inv) {
            const n = w * h, L = new Float32Array(n), C = new Float32Array(n);
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                L[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
                C[i] = d[p + 2] - (d[p] + d[p + 1]) / 2;
            }
            const r = Math.max(3, Math.round(Math.max(w, h) / 30));
            const bgL = boxBlur(L, w, h, r), bgC = boxBlur(C, w, h, r), score = new Float32Array(n);
            for (let i = 0; i < n; i++) {
                if (inv) {score[i] = clamp((L[i] - bgL[i]) / Math.max(40, 255 - bgL[i]), 0, 1); continue;}
                const dark = clamp((bgL[i] - L[i]) / Math.max(40, bgL[i]), 0, 1);
                const blue = clamp((C[i] - bgC[i] - 10) / 40, 0, 1);
                score[i] = dark * blue;
            }
            const thr = 0.42 - 0.34 * sens, m = Math.max(2, Math.round(0.015 * Math.min(w, h)));
            const k = w / 1000, minA = Math.max(3, Math.round(6 * k * k)), bandH = h / ROWS;
            const seen = new Uint8Array(n), stack = new Int32Array(n), pins = [];
            let found = 0, dropped = 0;
            for (let i0 = 0; i0 < n; i0++) {
                if (seen[i0] || score[i0] <= thr) continue;
                let sp = 0, top = 0, area = 0, sum = 0, x0 = w, x1 = -1, y0 = h, y1 = -1;
                stack[sp++] = i0; seen[i0] = 1;
                const list = [];
                while (sp) {
                    const i = stack[--sp], x = i % w, y = (i / w) | 0;
                    list.push(i); area++; sum += score[i];
                    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
                    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                        const xx = x + dx, yy = y + dy;
                        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
                        const j = yy * w + xx;
                        if (!seen[j] && score[j] > thr) {seen[j] = 1; stack[sp++] = j;}
                    }
                }
                found++;
                const mean = sum / area, bw = x1 - x0 + 1, bh = y1 - y0 + 1;
                const edge = x0 < m || y0 < m || x1 >= w - m || y1 >= h - m;
                if (area < minA || edge || mean < thr * 1.3 || bh > h * 0.25 || bw > w * 0.4 || area > n * 0.01) {dropped++; continue;}
                if (bh <= bandH * 1.5) {
                    let sy = 0;
                    for (const i of list) sy += score[i] * ((i / w) | 0);
                    const b = ROWS - 1 - Math.min(ROWS - 1, Math.floor(sy / sum / bandH));
                    pins.push({r: b, u0: x0 / w, u1: Math.min(1, (x1 + 1) / w), s: clamp(mean * 1.4, 0.2, 1)});
                    continue;
                }
                const bands = new Map();
                for (const i of list) {
                    const x = i % w, y = (i / w) | 0, b = ROWS - 1 - Math.min(ROWS - 1, Math.floor(y / bandH));
                    const e = bands.get(b) || {n: 0, s: 0, x0: w, x1: -1};
                    e.n++; e.s += score[i]; if (x < e.x0) e.x0 = x; if (x > e.x1) e.x1 = x;
                    bands.set(b, e);
                }
                const main = Math.max(...[...bands.values()].map(e => e.n));
                bands.forEach((e, b) => {
                    if (e.n < Math.max(minA / 2, main * 0.35)) return;
                    let u0 = e.x0 / w;
                    const u1 = (e.x1 + 1) / w, s = clamp(e.s / e.n * 1.4, 0.2, 1);
                    while (u1 - u0 > 0.08) {pins.push({r: b, u0, u1: u0 + 0.06, s}); u0 += 0.06;}
                    pins.push({r: b, u0, u1, s});
                });
            }
            pins.sort((a, b) => a.u0 - b.u0);
            const kept = [];
            for (const p of pins) {
                const near = kept.filter(q => p.u0 - q.u0 < 0.012);
                const twin = near.find(q => q.r === p.r);
                if (twin) {twin.u1 = Math.max(twin.u1, p.u1); twin.s = Math.max(twin.s, p.s); continue;}
                if (near.length >= POLY) continue;
                kept.push(p);
            }
            return {pins: kept, found, dropped};
        }

        async function render() {
            const dur = DUR, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            const off = new OAC(1, Math.ceil((dur + TAIL) * SR), SR);
            const comp = off.createDynamicsCompressor(), master = off.createGain();
            master.gain.value = 0.6; master.connect(comp); comp.connect(off.destination);
            for (const p of S.pins) {
                const t0 = p.u0 * dur, t1 = p.u1 * dur, f = rowFreq(p.r);
                const tau = 0.18 + 0.5 * Math.min(1.5, t1 - t0), end = t0 + Math.min(4, 5 * tau), peak = 0.12 + 0.3 * p.s;
                for (const [mul, amp, dec] of [[1, 1, 1], [2.76, 0.22, 0.35], [5.4, 0.08, 0.15]]) {
                    if (f * mul > SR / 2 - 1000) continue;
                    const o = off.createOscillator(), gn = off.createGain();
                    o.frequency.value = f * mul;
                    gn.gain.setValueAtTime(0, t0);
                    gn.gain.linearRampToValueAtTime(peak * amp, t0 + 0.003);
                    gn.gain.setTargetAtTime(0, t0 + 0.003, tau * dec);
                    o.connect(gn); gn.connect(master);
                    o.start(t0); o.stop(end);
                }
            }
            const buf = await off.startRendering();
            return wav(buf.getChannelData(0), SR);
        }

        function wav(x, sr) {
            const n = x.length, ab = new ArrayBuffer(44 + n * 2), d = new DataView(ab);
            const w = (o, s) => {for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i));};
            w(0, 'RIFF'); d.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); d.setUint32(16, 16, true);
            d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, sr, true); d.setUint32(28, sr * 2, true);
            d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, 'data'); d.setUint32(40, n * 2, true);
            for (let i = 0; i < n; i++) d.setInt16(44 + i * 2, clamp(x[i], -1, 1) * 32767, true);
            return new Blob([ab], {type: 'audio/wav'});
        }

        function loadFile(file) {
            if (!file) return;
            const url = URL.createObjectURL(file), img = new Image();
            els.camBtn.style.opacity = '0.5';
            img.onload = () => {S.src = img; setTimeout(() => {analyse(); els.camBtn.style.opacity = '';}, 20); URL.revokeObjectURL(url);};
            img.onerror = () => {els.camBtn.style.opacity = ''; URL.revokeObjectURL(url);};
            img.src = url;
        }

        function analyse() {
            stop();
            const {d, w, h} = pixels();
            S.pins = detect(d, w, h, SENS, false).pins;
            S.aspect = clamp(w / h, 1.6, 2.6); S.dirty = true; S.ready = true;
            els.view.hidden = false;
            draw(-1);
            els.play.disabled = !S.pins.length;
        }

        function draw(t) {
            if (!S.ready) return;
            const cv = els.view, dpr = Math.min(2, window.devicePixelRatio || 1), cw = cv.clientWidth || cv.parentElement.clientWidth;
            const W = Math.round(cw * dpr), H = Math.round(cw / S.aspect * dpr);
            if (cv.width !== W || cv.height !== H) {cv.width = W; cv.height = H;}
            const g = cv.getContext('2d');
            g.globalAlpha = 1; g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
            const pad = W * 0.04, span = W - 2 * pad, rh = (H - 2 * pad) / ROWS, X = u => pad + u * span;
            for (const p of S.pins) {
                const t0 = p.u0 * DUR, live = t >= t0 && t < t0 + 0.35;
                const cx = X(p.u0), cy = pad + (ROWS - 1 - p.r + 0.5) * rh, rad = Math.max(2.5 * dpr, rh * (0.28 + 0.14 * p.s));
                const len = Math.max(0, (p.u1 - p.u0) * span - 2 * rad);
                g.globalAlpha = live ? 1 : 0.7 + 0.3 * p.s;
                g.fillStyle = live ? '#2F7BD8' : '#002A52';
                g.beginPath();
                if (len > 0 && g.roundRect) g.roundRect(cx, cy - rad, len + 2 * rad, 2 * rad, rad); else g.arc(cx + rad, cy, rad, 0, Math.PI * 2);
                g.fill();
                if (live) {g.globalAlpha = 0.25; g.beginPath(); g.arc(cx + rad, cy, rad * 2.4, 0, Math.PI * 2); g.fill();}
            }
            g.globalAlpha = 1;
            if (t >= 0) {
                const x = X(clamp(t / DUR, 0, 1));
                g.fillStyle = 'rgba(0,42,82,0.12)'; g.fillRect(x - 8 * dpr, 0, 8 * dpr, H);
                g.fillStyle = 'rgba(0,42,82,0.55)'; g.fillRect(x - dpr * 0.75, 0, 1.5 * dpr, H);
            }
        }

        function stop() {
            cancelAnimationFrame(S.raf);
            if (S.audio) {S.audio.pause(); S.audio.currentTime = 0;}
            els.play.textContent = PLAY;
            draw(-1);
        }

        async function play() {
            if (S.audio && !S.audio.paused) {stop(); return;}
            if (!S.audio) {S.audio = new Audio(); S.audio.playsInline = true;}
            const a = S.audio;
            if (S.dirty) {
                a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
                a.play().catch(() => { });
                els.play.disabled = true; els.play.textContent = '\u2026';
                try {S.wav = await render();}
                catch (e) {els.play.disabled = false; stop(); return;}
                if (S.url) URL.revokeObjectURL(S.url);
                S.url = URL.createObjectURL(S.wav); a.src = S.url; S.dirty = false;
                els.play.disabled = false;
            }
            a.currentTime = 0;
            try {await a.play();} catch (e) {stop(); return;}
            els.play.textContent = STOP;
            a.onended = () => stop();
            const tick = () => {
                const t = a.currentTime;
                draw(t <= DUR ? t : -1);
                if (!a.paused) S.raf = requestAnimationFrame(tick);
            };
            S.raf = requestAnimationFrame(tick);
        }

        els.cam.addEventListener('change', e => {loadFile(e.target.files[0]); e.target.value = '';});
        els.play.addEventListener('click', play);
        window.addEventListener('resize', () => draw(-1));
    </script>
</body>

</html>
